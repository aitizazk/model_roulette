[package]
name = "model-roulette"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
flate2 = "1.1.10"
futures = "0.3.34"
httpdate = "1.0.3"
indexmap = { version = "2.14.2", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }
